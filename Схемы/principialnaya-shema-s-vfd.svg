<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="1100" height="850">
  <style>
    text { font-family: 'Segoe UI', Arial, sans-serif; }
    .title { font-size: 16px; font-weight: bold; fill: #1a1a2e; }
    .section-title { font-size: 12px; font-weight: bold; fill: #2c3e50; }
    .label { font-size: 11px; text-anchor: middle; fill: #222; }
    .label-sm { font-size: 10px; text-anchor: middle; fill: #555; }
    .label-left { font-size: 11px; fill: #222; }
    .label-vfd { font-size: 11px; text-anchor: middle; fill: #1e8449; font-weight: bold; }
    .wire { stroke: #2c3e50; stroke-width: 1.5; fill: none; }
    .wire-thick { stroke: #2c3e50; stroke-width: 2.5; fill: none; }
    .wire-ctrl { stroke: #e74c3c; stroke-width: 1.2; fill: none; stroke-dasharray: 5,3; }
    .wire-signal { stroke: #2980b9; stroke-width: 1.2; fill: none; }
    .box { fill: #fff; stroke: #2c3e50; stroke-width: 1.5; }
    .box-fill { fill: #eaf2f8; stroke: #2c3e50; stroke-width: 1.5; }
    .vfd-fill { fill: #d5f5e3; stroke: #27ae60; stroke-width: 2; }
    .motor-fill { fill: #fdebd0; stroke: #e67e22; stroke-width: 1.5; }
    .switch-fill { fill: #fef9e7; stroke: #f39c12; stroke-width: 1.5; }
    .prot-fill { fill: #fdedec; stroke: #e74c3c; stroke-width: 1.5; }
    .contact { fill: #f0f0f0; stroke: #2c3e50; stroke-width: 1; }
    .coil { fill: #e8f8f5; stroke: #1abc9c; stroke-width: 1.5; }
    .lamp-green { fill: #d5f5e3; stroke: #27ae60; stroke-width: 1.5; }
    .lamp-yellow { fill: #fef9e7; stroke: #f39c12; stroke-width: 1.5; }
    .lamp-red { fill: #fdedec; stroke: #e74c3c; stroke-width: 1.5; }
  </style>

  <!-- Title -->
  <text x="550" y="25" class="title" text-anchor="middle">Принципиальная электрическая схема подключения электродвигателя</text>
  <text x="550" y="42" class="label-sm" text-anchor="middle" font-size="12">с частотным преобразователем (VFD) и сигнальными лампами</text>

  <!-- ================================================================== -->
  <!-- СИЛОВАЯ ЦЕПЬ — 3 фазы (слева)                                      -->
  <!-- ================================================================== -->
  <text x="50" y="70" class="section-title">Силовая цепь (3×380 В)</text>

  <!-- Шины L1, L2, L3 -->
  <line x1="80" y1="80" x2="80" y2="690" class="wire-thick" stroke="#e67e22"/>
  <text x="75" y="95" class="label" fill="#e67e22">L1</text>
  <line x1="120" y1="80" x2="120" y2="690" class="wire-thick" stroke="#27ae60"/>
  <text x="115" y="95" class="label" fill="#27ae60">L2</text>
  <line x1="160" y1="80" x2="160" y2="690" class="wire-thick" stroke="#2980b9"/>
  <text x="155" y="95" class="label" fill="#2980b9">L3</text>

  <!-- QF — автоматический выключатель -->
  <rect x="55" y="105" width="130" height="55" rx="4" class="switch-fill"/>
  <text x="120" y="128" class="label" font-weight="bold">QF</text>
  <text x="120" y="142" class="label-sm">Автоматический</text>
  <text x="120" y="154" class="label-sm">выключатель</text>
  <line x1="80" y1="105" x2="80" y2="110" class="wire-thick" stroke="#e67e22"/>
  <line x1="80" y1="115" x2="80" y2="160" class="wire-thick" stroke="#e67e22"/>
  <line x1="120" y1="105" x2="120" y2="110" class="wire-thick" stroke="#27ae60"/>
  <line x1="120" y1="115" x2="120" y2="160" class="wire-thick" stroke="#27ae60"/>
  <line x1="160" y1="105" x2="160" y2="110" class="wire-thick" stroke="#2980b9"/>
  <line x1="160" y1="115" x2="160" y2="160" class="wire-thick" stroke="#2980b9"/>
  <line x1="65" y1="112" x2="95" y2="112" class="wire" stroke="#e67e22"/>
  <circle cx="80" cy="112" r="2" fill="#e67e22"/>
  <line x1="105" y1="112" x2="135" y2="112" class="wire" stroke="#27ae60"/>
  <circle cx="120" cy="112" r="2" fill="#27ae60"/>
  <line x1="145" y1="112" x2="175" y2="112" class="wire" stroke="#2980b9"/>
  <circle cx="160" cy="112" r="2" fill="#2980b9"/>

  <!-- KM — контактор (главные контакты) -->
  <rect x="55" y="185" width="130" height="60" rx="4" class="box-fill"/>
  <text x="120" y="210" class="label" font-weight="bold">KM</text>
  <text x="120" y="225" class="label-sm">Контактор</text>
  <text x="120" y="238" class="label-sm">(главные контакты)</text>
  <line x1="65" y1="192" x2="95" y2="192" class="wire" stroke="#e67e22"/>
  <circle cx="80" cy="192" r="2" fill="none" stroke="#e67e22"/>
  <circle cx="80" cy="192" r="3" fill="none" stroke="#e67e22"/>
  <line x1="105" y1="192" x2="135" y2="192" class="wire" stroke="#27ae60"/>
  <circle cx="120" cy="192" r="2" fill="none" stroke="#27ae60"/>
  <circle cx="120" cy="192" r="3" fill="none" stroke="#27ae60"/>
  <line x1="145" y1="192" x2="175" y2="192" class="wire" stroke="#2980b9"/>
  <circle cx="160" cy="192" r="2" fill="none" stroke="#2980b9"/>
  <circle cx="160" cy="192" r="3" fill="none" stroke="#2980b9"/>
  <line x1="65" y1="200" x2="95" y2="200" class="wire" stroke="#e67e22"/>
  <line x1="105" y1="200" x2="135" y2="200" class="wire" stroke="#27ae60"/>
  <line x1="145" y1="200" x2="175" y2="200" class="wire" stroke="#2980b9"/>

  <!-- Провода от KM к VFD -->
  <line x1="80" y1="245" x2="80" y2="280" class="wire-thick" stroke="#e67e22"/>
  <line x1="120" y1="245" x2="120" y2="280" class="wire-thick" stroke="#27ae60"/>
  <line x1="160" y1="245" x2="160" y2="280" class="wire-thick" stroke="#2980b9"/>

  <!-- UZ — Частотный преобразователь -->
  <rect x="40" y="280" width="165" height="130" rx="6" class="vfd-fill"/>
  <text x="122" y="308" class="label-vfd" font-size="14">UZ — VFD</text>
  <text x="122" y="325" class="label-sm" fill="#1e8449">Частотный преобразователь</text>
  <text x="122" y="355" class="label-sm" fill="#1e8449" text-anchor="middle">Вход: L1 L2 L3</text>
  <text x="122" y="370" class="label-sm" fill="#1e8449" text-anchor="middle">Выход: U V W</text>
  <text x="122" y="385" class="label-sm" fill="#1e8449" text-anchor="middle">PE ⟂</text>
  <text x="122" y="400" class="label-sm" fill="#1e8449" text-anchor="middle">Управление: DI, AI, AO</text>
  <text x="40" y="295" class="label-sm" fill="#1e8449">R/L1</text>
  <text x="40" y="310" class="label-sm" fill="#1e8449">S/L2</text>
  <text x="40" y="325" class="label-sm" fill="#1e8449">T/L3</text>
  <text x="195" y="340" class="label-sm" fill="#1e8449">U/T1</text>
  <text x="195" y="355" class="label-sm" fill="#1e8449">V/T2</text>
  <text x="195" y="370" class="label-sm" fill="#1e8449">W/T3</text>

  <!-- Провода от VFD к двигателю -->
  <line x1="80" y1="410" x2="80" y2="470" class="wire-thick" stroke="#e67e22"/>
  <text x="90" y="440" class="label-sm" fill="#e67e22">U</text>
  <line x1="120" y1="410" x2="120" y2="470" class="wire-thick" stroke="#27ae60"/>
  <text x="130" y="440" class="label-sm" fill="#27ae60">V</text>
  <line x1="160" y1="410" x2="160" y2="470" class="wire-thick" stroke="#2980b9"/>
  <text x="170" y="440" class="label-sm" fill="#2980b9">W</text>

  <!-- M — двигатель -->
  <circle cx="120" cy="530" r="55" class="motor-fill"/>
  <text x="120" y="520" class="label" font-weight="bold" fill="#d35400">M</text>
  <text x="120" y="538" class="label-sm" fill="#d35400">3~ АД</text>
  <text x="120" y="553" class="label-sm" fill="#d35400" font-size="9">0–50/60 Гц</text>

  <!-- PE — заземление -->
  <line x1="120" y1="585" x2="120" y2="610" class="wire"/>
  <line x1="105" y1="610" x2="135" y2="610" class="wire"/>
  <line x1="105" y1="616" x2="135" y2="616" class="wire"/>
  <text x="145" y="615" class="label-sm">PE (заземление)</text>

  <!-- ================================================================== -->
  <!-- ЦЕПЬ УПРАВЛЕНИЯ (справа вверху)                                    -->
  <!-- ================================================================== -->
  <text x="470" y="70" class="section-title">Цепь управления (220 В)</text>

  <text x="380" y="95" class="label-sm">~220 В (L — фаза)</text>
  <text x="520" y="95" class="label-sm">N (нейтраль)</text>

  <!-- SB1 — Стоп -->
  <rect x="360" y="105" width="70" height="28" rx="3" class="prot-fill"/>
  <text x="395" y="123" class="label-sm" font-weight="bold" fill="#c0392b">SB1</text>
  <text x="395" y="130" class="label-sm" font-size="8" fill="#c0392b">Стоп (НЗ)</text>

  <!-- SB2 — Пуск -->
  <rect x="360" y="155" width="70" height="28" rx="3" class="box-fill"/>
  <text x="395" y="173" class="label-sm" font-weight="bold">SB2</text>
  <text x="395" y="180" class="label-sm" font-size="8">Пуск (НО)</text>

  <!-- Катушка KM -->
  <rect x="350" y="205" width="90" height="35" rx="8" class="coil"/>
  <text x="395" y="222" class="label-sm" font-weight="bold" fill="#1abc9c">KM-A</text>
  <text x="395" y="234" class="label-sm" font-size="8" fill="#1abc9c">катушка</text>

  <!-- Соединения цепи управления -->
  <line x1="395" y1="100" x2="395" y2="105" class="wire-ctrl"/>
  <line x1="395" y1="133" x2="395" y2="155" class="wire-ctrl"/>
  <line x1="395" y1="183" x2="395" y2="205" class="wire-ctrl"/>
  <line x1="395" y1="240" x2="395" y2="270" class="wire-ctrl"/>
  <line x1="395" y1="270" x2="520" y2="270" class="wire-ctrl"/>
  <line x1="520" y1="100" x2="520" y2="270" class="wire-ctrl"/>

  <!-- ================================================================ -->
  <!-- СИГНАЛЬНЫЕ ЛАМПЫ                                                -->
  <!-- ================================================================ -->

  <!-- HL1 — зелёная "Сеть" (через вспом. контакт QF или просто после QF) -->
  <!-- Включена через блок-контакт KM (нормально замкнутый) — светит когда KM выключен, т.е. питание есть, но двигатель не работает -->
  <!-- На самом деле логичнее: HL1 (зелёный) - "Напряжение подано" - между L и N после QF, отдельный диффавтомат -->
  <!-- Сделаем проще: HL1 через НЗ блок-контакт KM (светится когда двигатель СТОИТ) -->

  <!-- HLG — зелёная "Сеть включена" -->
  <circle cx="650" cy="115" r="18" class="lamp-green"/>
  <text x="650" y="113" class="label-sm" font-size="12" fill="#27ae60" font-weight="bold">HLG</text>
  <text x="650" y="125" class="label-sm" font-size="8" fill="#27ae60">Сеть</text>
  <!-- Подключение HLG через блок-контакт KM (НЗ) — светится когда KM отключён -->
  <line x1="395" y1="115" x2="580" y2="115" class="wire-ctrl"/>
  <line x1="580" y1="105" x2="580" y2="135" class="wire-ctrl"/>
  <rect x="580" y="105" width="25" height="30" rx="2" class="contact"/>
  <text x="592" y="117" class="label-sm" font-size="8" fill="#555">KM</text>
  <text x="592" y="128" class="label-sm" font-size="7" fill="#555">НЗ</text>
  <line x1="605" y1="115" x2="632" y2="115" class="wire-ctrl"/>
  <line x1="668" y1="115" x2="700" y2="115" class="wire-ctrl"/>
  <line x1="700" y1="115" x2="700" y2="270" class="wire-ctrl"/>
  <!-- Резистор/ограничение тока -->
  <rect x="700" y="115" width="16" height="10" rx="1" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="708" y="123" class="label-sm" font-size="7" fill="#555">R</text>

  <!-- HLY — жёлтая "Двигатель работает" (через НО блок-контакт KM) -->
  <circle cx="780" cy="180" r="18" class="lamp-yellow"/>
  <text x="780" y="178" class="label-sm" font-size="12" fill="#d4a017" font-weight="bold">HLY</text>
  <text x="780" y="190" class="label-sm" font-size="8" fill="#d4a017">Работа</text>
  <!-- Подключение HLY через блок-контакт KM (НО) — светится когда KM включён -->
  <line x1="395" y1="180" x2="700" y2="180" class="wire-ctrl"/>
  <line x1="700" y1="170" x2="700" y2="200" class="wire-ctrl"/>
  <rect x="700" y="170" width="25" height="30" rx="2" class="contact"/>
  <text x="712" y="182" class="label-sm" font-size="8" fill="#555">KM</text>
  <text x="712" y="193" class="label-sm" font-size="7" fill="#555">НО</text>
  <line x1="725" y1="180" x2="762" y2="180" class="wire-ctrl"/>
  <line x1="798" y1="180" x2="830" y2="180" class="wire-ctrl"/>
  <line x1="830" y1="180" x2="830" y2="270" class="wire-ctrl"/>
  <rect x="830" y="180" width="16" height="10" rx="1" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="838" y="188" class="label-sm" font-size="7" fill="#555">R</text>

  <!-- HLR — красная "Авария" (через Relay 1 VFD — НЗ) -->
  <circle cx="780" cy="115" r="18" class="lamp-red"/>
  <text x="780" y="113" class="label-sm" font-size="12" fill="#c0392b" font-weight="bold">HLR</text>
  <text x="780" y="125" class="label-sm" font-size="8" fill="#c0392b">Авария</text>
  <!-- Подключение HLR через Relay 1 VFD (НЗ) — светится при аварии, контакт замыкается -->
  <line x1="395" y1="240" x2="640" y2="240" class="wire-ctrl"/>
  <line x1="640" y1="105" x2="640" y2="240" class="wire-ctrl"/>
  <rect x="640" y="105" width="25" height="30" rx="2" class="contact"/>
  <text x="652" y="117" class="label-sm" font-size="8" fill="#555">VFD</text>
  <text x="652" y="128" class="label-sm" font-size="7" fill="#555">Rel1</text>
  <line x1="665" y1="115" x2="762" y2="115" class="wire-ctrl"/>
  <line x1="798" y1="115" x2="830" y2="115" class="wire-ctrl"/>
  <line x1="830" y1="115" x2="830" y2="270" class="wire-ctrl"/>
  <rect x="830" y="115" width="16" height="10" rx="1" fill="#fff" stroke="#555" stroke-width="1"/>
  <text x="838" y="123" class="label-sm" font-size="7" fill="#555">R</text>

  <!-- ================================================================== -->
  <!-- УПРАВЛЕНИЕ VFD (справа, ниже)                                      -->
  <!-- ================================================================== -->
  <text x="470" y="330" class="section-title">Управление VFD (дискретные и аналоговые входы)</text>

  <!-- VFD блок управления -->
  <rect x="330" y="340" width="200" height="120" rx="5" class="vfd-fill"/>
  <text x="430" y="360" class="label-vfd">VFD — клеммы управления</text>

  <text x="340" y="382" class="label-sm" fill="#1e8449">DI1 — Пуск (НО)</text>
  <text x="340" y="402" class="label-sm" fill="#1e8449">DI2 — Стоп (НЗ)</text>
  <text x="340" y="422" class="label-sm" fill="#1e8449">DI3 — Сброс аварии</text>
  <text x="340" y="442" class="label-sm" fill="#1e8449">AI1 — 0..10 В (задание скорости)</text>
  <text x="340" y="462" class="label-sm" fill="#1e8449">AO1 — 0..10 В (вых. частота)</text>
  <text x="520" y="462" class="label-sm" font-size="9" fill="#1e8449">→ частотомер</text>

  <!-- Потенциометр -->
  <rect x="580" y="410" width="40" height="60" rx="3" class="box-fill"/>
  <text x="600" y="430" class="label-sm" font-size="9">RP</text>
  <text x="600" y="455" class="label-sm" font-size="8">0–10 кОм</text>
  <text x="600" y="470" class="label-sm" font-size="8">задание</text>
  <text x="600" y="480" class="label-sm" font-size="8">скорости</text>

  <line x1="530" y1="442" x2="580" y2="442" class="wire-signal"/>
  <line x1="600" y1="410" x2="600" y2="390" class="wire-signal"/>
  <text x="610" y="405" class="label-sm" font-size="8">+10 В</text>
  <line x1="600" y1="470" x2="600" y2="520" class="wire-signal"/>
  <text x="610" y="515" class="label-sm" font-size="8">GND</text>

  <!-- ================================================================== -->
  <!-- ВЫХОДНЫЕ РЕЛЕ VFD                                                 -->
  <!-- ================================================================== -->
  <text x="470" y="500" class="section-title">Выходные сигналы VFD</text>

  <rect x="360" y="515" width="140" height="25" rx="3" class="prot-fill"/>
  <text x="430" y="532" class="label-sm" font-size="9" fill="#c0392b">Relay 1 — Авария (НЗ)</text>

  <rect x="360" y="550" width="140" height="25" rx="3" class="box-fill"/>
  <text x="430" y="567" class="label-sm" font-size="9">Relay 2 — Достижение скорости</text>

  <!-- ================================================================== -->
  <!-- ЛЕГЕНДА / УСЛОВНЫЕ ОБОЗНАЧЕНИЯ                                     -->
  <!-- ================================================================== -->
  <rect x="45" y="710" width="1010" height="120" rx="6" fill="#f8f9fa" stroke="#ccc" stroke-width="1"/>
  <text x="60" y="730" font-size="12" font-weight="bold" fill="#1a1a2e">Условные обозначения и описание работы:</text>

  <text x="60" y="750" font-size="10" fill="#444">— Силовая цепь: 3×380 В, 50 Гц → QF (авт. выкл.) → KM (контактор) → UZ (VFD) → M (асинхр. двигатель)</text>
  <text x="60" y="768" font-size="10" fill="#444">— Цепь управления: ~220 В (L-N) → SB1 (Стоп, НЗ) → SB2 (Пуск, НО) → KM-A (катушка) → N</text>
  <text x="60" y="786" font-size="10" fill="#444">— Самоподхват: блок-контакт KM шунтирует SB2 после пуска</text>
  <text x="60" y="804" font-size="10" fill="#444">— Сигнальные лампы: HLG (зел.) — «Сеть» (двигатель остановлен); HLY (жёлт.) — «Работа» (двигатель запущен); HLR (красн.) — «Авария»</text>
  <text x="60" y="822" font-size="10" fill="#444">— Защита: QF — от КЗ и перегрузки; VFD — встроенная защита двигателя (I²t, PTC); KM — аварийный останов</text>

  <!-- Условные обозначения ламп -->
  <circle cx="870" cy="745" r="9" class="lamp-green"/>
  <text x="883" y="749" font-size="9" fill="#27ae60">HLG</text>
  <text x="870" y="758" font-size="8" fill="#555">Сеть</text>

  <circle cx="920" cy="745" r="9" class="lamp-yellow"/>
  <text x="933" y="749" font-size="9" fill="#d4a017">HLY</text>
  <text x="920" y="758" font-size="8" fill="#555">Работа</text>

  <circle cx="970" cy="745" r="9" class="lamp-red"/>
  <text x="983" y="749" font-size="9" fill="#c0392b">HLR</text>
  <text x="970" y="758" font-size="8" fill="#555">Авария</text>

  <line x1="870" y1="770" x2="880" y2="770" class="wire-ctrl"/>
  <text x="885" y="774" font-size="10" fill="#444">— цепь управления (220 В)</text>
  <line x1="870" y1="785" x2="880" y2="785" class="wire-signal"/>
  <text x="885" y="789" font-size="10" fill="#444">— сигнальные цепи (24 В / 0–10 В)</text>
  <line x1="870" y1="800" x2="880" y2="800" class="wire-thick"/>
  <text x="885" y="804" font-size="10" fill="#444">— силовая цепь</text>
</svg>